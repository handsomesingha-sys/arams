<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></div>
      <h1 class="login-title">ARAMS</h1>
      <p class="login-subtitle">ระบบบริหารงานทะเบียนและวัดผลทางการศึกษา</p>
      <form id="loginForm">
        <div class="field"><label for="loginEmail">อีเมลผู้ใช้งาน</label><input id="loginEmail" name="email" type="email" autocomplete="username" required placeholder="name@school.ac.th"></div>
        <div class="field"><label for="loginPassword">รหัสผ่าน</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="กรอกรหัสผ่าน"></div>
        <button class="btn btn-primary btn-block" type="submit" id="loginButton"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>
      </form>
      <p class="small muted text-center" style="margin:18px 0 0">สำหรับบุคลากร นักเรียน และผู้ปกครองที่ได้รับสิทธิ์</p>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
    <div id="mobileOverlay" class="mobile-overlay" onclick="toggleSidebar(false)"></div>
    <aside id="sidebar" class="sidebar">
      <div class="side-brand"><div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div><div><strong>ARAMS</strong><small>Academic Management System</small></div></div>
      <div class="side-user"><strong id="sideUserName">ผู้ใช้งาน</strong><span id="sideUserRole" class="small" style="color:#c6d5e7">-</span></div>
      <nav id="sideNav" class="side-nav" aria-label="เมนูหลัก"></nav>
      <div class="side-footer">
        <button class="nav-link" onclick="openChangePassword()"><i class="fa-solid fa-key"></i><span>เปลี่ยนรหัสผ่าน</span></button>
        <button class="nav-link" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>ออกจากระบบ</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar no-print">
        <div class="topbar-left"><button class="btn btn-outline mobile-menu" onclick="toggleSidebar()" aria-label="เปิดเมนู"><i class="fa-solid fa-bars"></i></button><div class="page-heading" id="topPageTitle">Dashboard</div></div>
        <div class="topbar-right"><span id="connectionStatus" class="connection-status"><i class="fa-solid fa-circle-notch fa-spin"></i> กำลังตรวจสอบ</span><span class="topbar-meta" id="currentAcademicLabel"></span><div class="user-chip"><span class="user-avatar"><i class="fa-solid fa-user"></i></span><span class="user-name" id="topUserName">ผู้ใช้งาน</span></div></div>
      </header>
      <div id="pageContent" class="content"><div class="loading-line"></div></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script>
    'use strict';

    async function apiRequest(action,data={},options={}) {
      if(!ARAMS_API.url) {
        const saved=await Swal.fire({title:'ตั้งค่า URL ของ API',text:'วาง Web App URL ของ Google Apps Script ที่ลงท้ายด้วย /exec',input:'url',inputPlaceholder:'https://script.google.com/macros/s/.../exec',showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',inputValidator:value=>!value||!/^https:\/\/.+\/exec(?:\?.*)?$/.test(value)?'กรุณาระบุ Web App URL ให้ถูกต้อง':undefined});
        if(!saved.isConfirmed)return {success:false,message:'ยังไม่ได้กำหนด URL ของ API'};
        ARAMS_API.url=saved.value.trim();localStorage.setItem('ARAMS_API_URL',ARAMS_API.url);
      }
      const body={action,token:options.token!==undefined?options.token:ARAMS_API.token,data:data||{}};
      try {
        const response=await fetch(ARAMS_API.url,{method:'POST',mode:'cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        const text=await response.text();
        let result;try{result=JSON.parse(text);}catch(_){throw new Error('Invalid response');}
        if(!result||typeof result.success!=='boolean')throw new Error('Invalid response format');
        if(!result.success) {
          const msg=friendlyError(result.message);
          if(/เซสชันหมดอายุ/.test(msg)){clearSession();}
          return {...result,message:msg};
        }
        return result;
      } catch(error) {
        console.error('ARAMS request failed:',action,error);
        return {success:false,message:'เชื่อมต่อข้อมูลไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่'};
      }
    }

      if(!result.success){area.innerHTML='<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><div>'+escapeHtml(result.message)+'</div></div>';setConnection(false,'เชื่อมต่อข้อมูลไม่สำเร็จ');return;}
      setConnection(true,'เชื่อมต่อแล้ว');const payload=result.data||{};ARAMS_API.currentRecords=payload.records||[];ARAMS_API.currentPagination=payload.pagination||{};
      const records=ARAMS_API.currentRecords,fields=(TABLE_SCHEMA[table]||[]).filter(f=>!HIDDEN_FIELDS.has(f)&&!BASE_FIELDS.has(f)).slice(0,8);

      else {
        html='<div class="table-wrap"><table class="data-table"><thead><tr>'+(module?.canDelete&&!module?.readOnly?'<th class="no-print"><input type="checkbox" onchange="toggleSelectAll(this.checked)" aria-label="เลือกทั้งหมด"></th>':'')+fields.map(f=>'<th>'+escapeHtml(labelOf(f))+'</th>').join('')+'<th>จัดการ</th></tr></thead><tbody>';
        html+=records.map((r,index)=>'<tr>'+(module?.canDelete&&!module?.readOnly?'<td class="no-print"><input type="checkbox" class="row-select" value="'+escapeHtml(r.id)+'" onchange="toggleRowSelection(this.value,this.checked)"></td>':'')+fields.map(f=>'<td>'+renderCell(r[f],f)+'</td>').join('')+'<td><div class="table-actions">'+(module?.canRead?'<button class="btn btn-outline btn-sm" title="ดูรายละเอียด" onclick="viewRecord(\''+escapeHtml(r.id)+'\')"><i class="fa-solid fa-eye"></i></button>':'')+(module?.canUpdate&&!module?.readOnly?'<button class="btn btn-outline btn-sm" title="แก้ไข" onclick="openRecordForm(\''+escapeHtml(r.id)+'\')"><i class="fa-solid fa-pen"></i></button>':'')+(module?.canDelete&&!module?.readOnly&&table!=='USERS'?'<button class="btn btn-danger btn-sm" title="ลบ" onclick="deleteRecord(\''+escapeHtml(r.id)+'\')"><i class="fa-solid fa-trash"></i></button>':'')+(table==='USERS'&&module?.canUpdate&&!module?.readOnly?'<button class="btn btn-outline btn-sm" title="กำหนดรหัสผ่านใหม่" onclick="resetUserPassword(\''+escapeHtml(r.id)+'\')"><i class="fa-solid fa-key"></i></button><button class="btn btn-danger btn-sm" title="ปิดใช้งานบัญชี" onclick="deactivateUser(\''+escapeHtml(r.id)+'\')"><i class="fa-solid fa-user-slash"></i></button>':'')+'</div></td></tr>').join('');
        html+='</tbody></table></div>';
      }
      const p=ARAMS_API.currentPagination||{};const total=Number(p.total||0),pages=Number(p.totalPages||1);
      html+='<div class="pagination"><div class="muted small">แสดง '+(total?((Number(p.page)-1)*Number(p.pageSize)+1):0)+'–'+Math.min(Number(p.page||1)*Number(p.pageSize||50),total)+' จาก '+total.toLocaleString('th-TH')+' รายการ</div><div class="pagination-actions"><select class="filter-input" style="width:auto;min-height:33px" onchange="changePageSize(this.value)"><option value="25" '+(ARAMS_API.pageSize===25?'selected':'')+'>25 รายการ</option><option value="50" '+(ARAMS_API.pageSize===50?'selected':'')+'>50 รายการ</option><option value="100" '+(ARAMS_API.pageSize===100?'selected':'')+'>100 รายการ</option><option value="200" '+(ARAMS_API.pageSize===200?'selected':'')+'>200 รายการ</option></select><button class="btn btn-outline btn-sm" '+(Number(p.page||1)<=1?'disabled':'')+' onclick="goPage(1)"><i class="fa-solid fa-angles-left"></i></button><button class="btn btn-outline btn-sm" '+(!p.hasPrevious?'disabled':'')+' onclick="goPage('+(Number(p.page||1)-1)+')"><i class="fa-solid fa-angle-left"></i></button><span class="small" style="padding:6px 4px">หน้า '+Number(p.page||1)+' / '+pages+'</span><button class="btn btn-outline btn-sm" '+(!p.hasNext?'disabled':'')+' onclick="goPage('+(Number(p.page||1)+1)+')"><i class="fa-solid fa-angle-right"></i></button><button class="btn btn-outline btn-sm" '+(Number(p.page||1)>=pages?'disabled':'')+' onclick="goPage('+pages+')"><i class="fa-solid fa-angles-right"></i></button></div></div>';
      if(module?.canDelete&&!module?.readOnly&&table!=='USERS')html+='<div class="quick-actions no-print" style="margin-top:12px"><button class="btn btn-danger btn-sm" onclick="deleteSelectedRecords()"><i class="fa-solid fa-trash"></i> ลบรายการที่เลือก</button></div>';
      area.innerHTML=html;
    }
    function renderCell(value,field) {
      if(IMAGE_FIELDS.has(field)&&value){return '<img src="'+escapeHtml(value)+'" alt="รูปภาพ" loading="lazy" style="width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid #dce3eb" onerror="this.style.display=\'none\'">';}
      if(field==='status'||/Status$/.test(field)||field==='resultCode')return statusBadge(value);
      if(typeof value==='string'&&/^https?:\/\//i.test(value))return '<a href="'+escapeHtml(value)+'" target="_blank" rel="noopener" class="small">เปิดลิงก์ <i class="fa-solid fa-arrow-up-right-from-square"></i></a>';
      if(typeof value==='string'&&value.length>80)return '<span title="'+escapeHtml(value)+'">'+escapeHtml(value.slice(0,77))+'…</span>';
      return escapeHtml(displayValue(value,field));
    }
    async function changePageSize(value){ARAMS_API.pageSize=Math.min(200,Math.max(25,Number(value)||50));ARAMS_API.currentPage=1;await loadRecords();}
    async function goPage(page){ARAMS_API.currentPage=page;await loadRecords();}
    function toggleRowSelection(id,checked){if(checked)ARAMS_API.selectedRows.add(id);else ARAMS_API.selectedRows.delete(id);}
    function toggleSelectAll(checked){document.querySelectorAll('.row-select').forEach(el=>{el.checked=checked;toggleRowSelection(el.value,checked);});}

    function makeFieldControl(field,value,table,readonly=false) {
      const current=value===null||value===undefined?'':value;
      const required=(REQUIRED_FIELDS[table]||[]).includes(field);
      const id='field_'+field;
      let type='text',extra='',control='';
      if(IMAGE_FIELDS.has(field)) {
        return '<div class="field form-field '+(field==='photoUrl'||field==='logoUrl'?'full':'')+'"><label>'+escapeHtml(labelOf(field))+'</label><div class="file-input"><input type="file" id="'+id+'_file" accept="image/jpeg,image/png,image/webp" '+(readonly?'disabled':'')+' onchange="previewLocalImage(\''+field+'\',this)"><div class="field-hint">เลือกไฟล์จากเครื่องโดยตรง รองรับ JPG, PNG, WEBP ขนาดไม่เกิน 5 MB</div><img id="'+id+'_preview" class="image-preview '+(current?'':'hidden')+'" src="'+escapeHtml(current)+'" alt="ตัวอย่างรูปภาพ" '+(current?'':'hidden')+'><input type="hidden" id="'+id+'" value="'+escapeHtml(current)+'"></div></div>';
      }
      if(/(Date|At)$/.test(field)||['birthDate','enrollmentDate','graduationDate','attendanceDate','achievementDate','effectiveDate','submittedAt'].includes(field))type='date';
      else if(/(Score|Gpa|GPA|Point|Credit|Hours|Count|Number|Percent|Weight|minimumCredits|minimumGpa|lastNumber|periodNo)$/i.test(field))type='number';
      else if(/^(is[A-Z]|can[A-Z]|mustChangePassword|isLocked|isCore|isElective|isActive|allowed)$/.test(field))type='select';
      else if(/Json$/.test(field)||['roleCodes','prerequisiteSubjectIds','details','description','address','currentAddress','medicalNotes','specialNeeds','notes','reason','resultMessage'].includes(field)||current.length>100)type='textarea';
      else if(['gender','level','currentLevel','admissionLevel'].includes(field))type='select-level';
      else if(['status','studentStatus','selectionStatus','reportingStatus','requestStatus','registrationStatus','attendanceStatus','caseStatus','documentStatus','assessmentStatus','resultCode'].includes(field))type='select-status';
      else if(['title'].includes(field))type='select-title';
      if(type==='textarea') control='<textarea id="'+id+'" '+(readonly?'readonly':'')+' '+(required?'required':'')+'>'+escapeHtml(current)+'</textarea>';
      else if(type==='select') control='<select id="'+id+'" '+(readonly?'disabled':'')+'><option value="">— เลือก —</option><option value="TRUE" '+(['TRUE','true','1'].includes(String(current))?'selected':'')+'>ใช่ / เปิดใช้งาน</option><option value="FALSE" '+(['FALSE','false','0'].includes(String(current))?'selected':'')+'>ไม่ใช่ / ปิดใช้งาน</option></select>';
      else if(type==='select-level') {const opts=['ม.1','ม.2','ม.3','ม.4','ม.5','ม.6','ประถมศึกษา','อื่น ๆ'];control='<select id="'+id+'" '+(readonly?'disabled':'')+'><option value="">— เลือก —</option>'+opts.map(x=>'<option '+(String(current)===x?'selected':'')+'>'+x+'</option>').join('')+'</select>';}
      else if(type==='select-title') {const opts=['เด็กชาย','เด็กหญิง','นาย','นางสาว','นาง','ดร.','อื่น ๆ'];control='<select id="'+id+'" '+(readonly?'disabled':'')+'><option value="">— เลือก —</option>'+opts.map(x=>'<option '+(String(current)===x?'selected':'')+'>'+x+'</option>').join('')+'</select>';}
      else if(type==='select-status') {const opts=['ACTIVE','INACTIVE','PENDING','APPROVED','REJECTED','COMPLETED','CANCELLED','PASS','FAIL','PRESENT','ABSENT','LATE','LEAVE','0','ร','มส','มผ'];control='<select id="'+id+'" '+(readonly?'disabled':'')+'><option value="">— เลือก —</option>'+opts.map(x=>'<option value="'+x+'" '+(String(current).toUpperCase()===x?'selected':'')+'>'+escapeHtml(STATUS_LABELS[x]||x)+'</option>').join('')+'</select>';}
      else control='<input id="'+id+'" type="'+type+'" value="'+escapeHtml(current)+'" '+(type==='number'?'step="any"':'')+' '+(required?'required':'')+' '+(readonly?'readonly':'')+'>';
      const full=['notes','details','description','currentAddress','address','medicalNotes','specialNeeds','prerequisiteSubjectIds','roleCodes'].includes(field);
      return '<div class="field form-field '+(full?'full':'')+'"><label for="'+id+'">'+escapeHtml(labelOf(field))+(required?' <span style="color:#b42318">*</span>':'')+'</label>'+control+'</div>';
    }
    function previewLocalImage(field,input) {
      const file=input.files&&input.files[0];if(!file)return;
      if(!['image/jpeg','image/png','image/webp'].includes(file.type)){notify('warning','ชนิดไฟล์ไม่รองรับ','กรุณาเลือกไฟล์ JPG, PNG หรือ WEBP');input.value='';return;}
      if(file.size>MAX_UPLOAD_BYTES){notify('warning','ไฟล์มีขนาดใหญ่เกินไป','กรุณาเลือกไฟล์รูปภาพที่มีขนาดไม่เกิน 5 MB');input.value='';return;}
      const reader=new FileReader();reader.onload=()=>{const img=document.getElementById('field_'+field+'_preview');img.src=reader.result;img.classList.remove('hidden');img.hidden=false;};reader.readAsDataURL(file);
    }
    async function uploadLocalImage(file,module,recordId) {
      const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(new Error('file'));reader.readAsDataURL(file);});
      const result=await apiRequest('upload.image',{module,recordId:recordId||'',fileName:file.name,mimeType:file.type,base64});
      if(!result.success)throw new Error(result.message||'อัปโหลดรูปภาพไม่สำเร็จ');return result.data.url;
    }

    async function openRecordForm(id) {
      const moduleCode=ARAMS_API.currentModule,table=ARAMS_API.currentTable,module=ARAMS_API.modules[moduleCode]||MODULES[moduleCode];
      let record={};if(id){const r=await apiRequest('data.get',{module:moduleCode,table,id});if(!r.success){await notify('error','ไม่สามารถเปิดข้อมูลได้',r.message);return;}record=r.data||{};}
      if(table==='USERS'){await openUserForm(record);return;}
      const fields=(TABLE_SCHEMA[table]||[]).filter(f=>!HIDDEN_FIELDS.has(f)&&!BASE_FIELDS.has(f));
      const locked=Boolean(id)&&!module.canUpdate;
      const html='<form id="recordEditor" class="text-left" style="max-height:65vh;overflow:auto;padding-right:8px"><div class="form-grid">'+fields.map(f=>makeFieldControl(f,record[f],table,locked)).join('')+'</div></form>';
      const result=await Swal.fire({title:(id?'แก้ไข':'เพิ่ม')+' '+(TABLE_LABELS[table]||table),html,width:'min(900px, 96vw)',showCancelButton:true,confirmButtonText:id?'บันทึกการแก้ไข':'บันทึกข้อมูล',cancelButtonText:'ยกเลิก',confirmButtonColor:'#17365d',focusConfirm:false,preConfirm:()=>{const record=collectFormRecord(fields,table);if(record===false)return false;const files=fields.filter(f=>IMAGE_FIELDS.has(f)).map(field=>({field,file:document.getElementById('field_'+field+'_file')?.files?.[0]||null})).filter(item=>item.file);return{record,files};}});
      if(!result.isConfirmed)return;
      const payload=result.value?.record;if(!payload)return;
      const fileUploads=result.value.files||[];
      const action=id?'data.update':'data.create';const args=id?{module:moduleCode,table,id,record:payload}:{module:moduleCode,table,record:payload};
      Swal.fire({title:'กำลังบันทึกข้อมูล',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
      const saved=await apiRequest(action,args);if(!saved.success){Swal.close();await notify('error','บันทึกข้อมูลไม่สำเร็จ',saved.message);return;}
      let recordId=saved.data?.id||id;
      try {
        for(const item of fileUploads){const url=await uploadLocalImage(item.file,moduleCode,recordId);const updated=await apiRequest('data.update',{module:moduleCode,table,id:recordId,record:{[item.field]:url}});if(!updated.success)throw new Error(updated.message);}
        Swal.close();await notify('success','บันทึกข้อมูลเรียบร้อยแล้ว',fileUploads.length?'อัปโหลดรูปภาพและบันทึกลิงก์เรียบร้อยแล้ว':'');await loadRecords();
      } catch(error){Swal.close();await notify('warning','บันทึกข้อมูลแล้ว แต่การอัปโหลดรูปภาพไม่สำเร็จ','กรุณาแก้ไขรายการแล้วอัปโหลดรูปภาพอีกครั้ง');await loadRecords();}
    }
    function collectFormRecord(fields,table) {
      const record={};let valid=true;
      for(const field of fields){if(IMAGE_FIELDS.has(field)){const hidden=document.getElementById('field_'+field);if(hidden&&hidden.value)record[field]=hidden.value;continue;}const el=document.getElementById('field_'+field);if(!el)continue;let value=el.value;
        if(el.required&&!String(value).trim()){el.focus();valid=false;break;}
        if(el.type==='number'&&value!=='')value=Number(value);
        if(field==='roleCodes'&&typeof value==='string'&&value.trim()){try{JSON.parse(value);}catch(_){el.focus();notify('warning','รูปแบบข้อมูลไม่ถูกต้อง','กรุณาระบุบทบาทในรูปแบบ JSON เช่น ["TEACHER"]');valid=false;break;}}
        if(value!==''&&value!==null)record[field]=value;
      }
      if(!valid){Swal.showValidationMessage('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน');return false;}return record;
    }
    async function viewRecord(id) {
      const r=await apiRequest('data.get',{module:ARAMS_API.currentModule,table:ARAMS_API.currentTable,id});if(!r.success){await notify('error','ไม่สามารถเปิดรายละเอียดได้',r.message);return;}
      const record=r.data||{};const rows=Object.keys(record).filter(f=>!HIDDEN_FIELDS.has(f)).map(f=>'<div style="display:grid;grid-template-columns:180px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #edf1f5"><strong>'+escapeHtml(labelOf(f))+'</strong><span style="overflow-wrap:anywhere">'+escapeHtml(displayValue(record[f],f))+'</span></div>').join('');
      await Swal.fire({title:'รายละเอียดข้อมูล',html:'<div class="text-left" style="max-height:65vh;overflow:auto">'+rows+'</div>',width:'min(800px,96vw)',confirmButtonText:'ปิด',confirmButtonColor:'#17365d'});
    }
    async function deleteRecord(id) {
      const yes=await confirmAction('ยืนยันการลบ','รายการนี้จะถูกย้ายไปสถานะลบ และไม่แสดงในรายการปกติ','ลบรายการ');if(!yes)return;
      const reason=await Swal.fire({title:'ระบุเหตุผลการลบ',input:'text',inputPlaceholder:'เหตุผล (ถ้ามี)',showCancelButton:true,confirmButtonText:'ดำเนินการ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#b42318'});if(!reason.isConfirmed)return;
      const result=await apiRequest('data.delete',{module:ARAMS_API.currentModule,table:ARAMS_API.currentTable,id,reason:reason.value||''});if(!result.success){await notify('error','ลบข้อมูลไม่สำเร็จ',result.message);return;}await notify('success','ลบรายการเรียบร้อยแล้ว');await loadRecords();
    }
    async function deleteSelectedRecords() {
      const ids=Array.from(ARAMS_API.selectedRows);if(!ids.length){await notify('info','ยังไม่ได้เลือกรายการ','กรุณาเลือกรายการที่ต้องการลบ');return;}
      const yes=await confirmAction('ยืนยันการลบ '+ids.length+' รายการ','รายการที่เลือกจะถูกย้ายไปสถานะลบ','ลบรายการที่เลือก');if(!yes)return;
      let done=0;for(const id of ids){const r=await apiRequest('data.delete',{module:ARAMS_API.currentModule,table:ARAMS_API.currentTable,id,reason:'ลบรายการแบบกลุ่ม'});if(r.success)done++;}
      ARAMS_API.selectedRows.clear();await notify('success','ดำเนินการเรียบร้อย','ลบสำเร็จ '+done+' จาก '+ids.length+' รายการ');await loadRecords();
    }

    async function openUserForm(record={}) {
      const isEdit=Boolean(record.id);
      const rolesResult=await apiRequest('system.options',{module:'settings',type:'roles'});
      const roles=rolesResult.success?rolesResult.data||[]:[];

    async function runWorkflow(module,task) {
      if(module==='admissions'&&task==='convert')return workflowConvertAdmission();
      if(module==='registration'&&task==='validate')return workflowValidateRegistration();
      if(module==='attendance'&&task==='summary')return workflowAttendanceSummary();
      if(module==='assessment'&&task==='calculate')return workflowCalculateGrades();
      if(module==='assessment'&&task==='approve')return workflowApproveGrades();
      if(module==='graduation'&&task==='graduation')return workflowCheckGraduation();
      if(module==='graduation'&&task==='number')return workflowNextDocumentNumber();
      if(module==='lec'&&task==='lec')return renderDataModule('lec','LEC_DATA_CHECKS');
      if(module==='calendar'&&task==='calendar')return renderDataModule('calendar','ACADEMIC_CALENDAR');
      if(module==='studentSupport'&&task==='support')return renderDataModule('studentSupport','STUDENT_ALERTS');
      if(module==='services'&&task==='services')return renderDataModule('services','SERVICE_REQUESTS');
    }

      const result=await apiRequest('academic.calculateGrades',r.value);if(!result.success){Swal.close();await notify('error','คำนวณผลการเรียนไม่สำเร็จ',result.message);return;}

      const records=rows.map(x=>{const old=existingMap.get(String(x.studentId));return {id:old?.id||'',studentId:x.studentId,academicYear:r.value.academicYear,termCode:r.value.termCode,subjectId:r.value.subjectId,totalScore:x.totalScore,gradeLabel:x.gradeLabel,gradePoint:x.gradePoint,resultCode:x.resultCode,credit:x.credit,creditEarned:['ผ่าน','ผ','PASS'].includes(String(x.resultCode).toUpperCase())?x.credit:0,assessmentStatus:'CALCULATED',approvedAt:'',approvedBy:'',isLocked:'FALSE',revisionNo:old?Number(old.revisionNo||0)+1:1};});

      const result=await Swal.fire({title:'นำเข้าข้อมูล CSV',html:'<div class="text-left"><p class="muted">กรุณาใช้ชื่อคอลัมน์ตรงกับชื่อฟิลด์ในระบบ เช่น studentCode, firstName, lastName</p><button type="button" class="btn btn-outline btn-sm" id="downloadCsvTemplate"><i class="fa-solid fa-download"></i> ดาวน์โหลดแม่แบบ CSV</button><div class="field" style="margin-top:14px"><label>เลือกไฟล์ CSV จากเครื่อง</label><input type="file" id="csvImportFile" accept=".csv,text/csv"></div></div>',showCancelButton:true,confirmButtonText:'นำเข้าข้อมูล',cancelButtonText:'ยกเลิก',confirmButtonColor:'#17365d',didOpen:()=>{document.getElementById('downloadCsvTemplate').onclick=()=>downloadTextFile('\uFEFF'+fields.join(',')+'\r\n',table+'_template.csv','text/csv;charset=utf-8');},preConfirm:async()=>{const file=document.getElementById('csvImportFile').files[0];if(!file){Swal.showValidationMessage('กรุณาเลือกไฟล์ CSV');return false;}if(file.size>5*1024*1024){Swal.showValidationMessage('ไฟล์มีขนาดใหญ่เกิน 5 MB');return false;}return await file.text();}});if(!result.isConfirmed)return;
      try {const rows=parseCsv(result.value);if(!rows.length){await notify('warning','ไม่พบข้อมูล','ไฟล์ CSV ไม่มีแถวข้อมูล');return;}const headers=rows.shift().map(x=>String(x).trim().replace(/^\uFEFF/,''));const schema=TABLE_SCHEMA[table]||[];const allowed=headers.filter(h=>schema.includes(h)&&!HIDDEN_FIELDS.has(h)&&!BASE_FIELDS.has(h));if(!allowed.length){await notify('error','ไม่พบคอลัมน์ที่รองรับ','กรุณาใช้แม่แบบ CSV ของระบบ');return;}
        const records=rows.filter(row=>row.some(v=>String(v||'').trim())).map(row=>{const obj={};allowed.forEach(h=>{const i=headers.indexOf(h);if(i>=0&&row[i]!==undefined&&row[i]!=='')obj[h]=row[i];});return obj;});
        if(records.length>5000){await notify('warning','จำนวนข้อมูลเกินกำหนด','นำเข้าได้ไม่เกิน 5,000 รายการต่อรอบ');return;}
        Swal.fire({title:'กำลังนำเข้าข้อมูล',text:'จำนวน '+records.length+' รายการ',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});let inserted=0,updated=0,skipped=0;const uniqueField=({STUDENTS:'studentCode',SUBJECTS:'subjectCode',TEACHERS:'email',ADMISSIONS:'applicationNo'})[table]||'id';
        for(let i=0;i<records.length;i+=200){const r=await apiRequest('data.bulkUpsert',{module,table,uniqueField,records:records.slice(i,i+200)});if(!r.success){Swal.close();await notify('error','นำเข้าข้อมูลไม่ครบถ้วน',r.message+' ดำเนินการแล้ว '+inserted+' รายการ');return;}inserted+=r.data.inserted||0;updated+=r.data.updated||0;skipped+=r.data.skipped||0;}
        Swal.close();await notify('success','นำเข้าข้อมูลเรียบร้อยแล้ว','เพิ่ม '+inserted+' · ปรับปรุง '+updated+' · ข้าม '+skipped);await loadRecords();
      }catch(error){console.error(error);await notify('error','อ่านไฟล์ไม่สำเร็จ','กรุณาตรวจสอบรูปแบบไฟล์ CSV และเข้ารหัส UTF-8');}
    }
    function parseCsv(text) {
      const rows=[];let row=[],field='',quoted=false;const src=String(text||'').replace(/^\uFEFF/,'');
      for(let i=0;i<src.length;i++){const ch=src[i],next=src[i+1];if(ch==='"'){if(quoted&&next==='"'){field+='"';i++;}else quoted=!quoted;}else if(ch===','&&!quoted){row.push(field);field='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(field);rows.push(row);row=[];field='';}else field+=ch;}
      if(field.length||row.length){row.push(field);rows.push(row);}return rows;
    }

ber(counts.openGradeImprovements||0).toLocaleString('th-TH')+'</strong></div><div class="simple-list-item"><span>จำนวนรายการเวลาเรียนที่นำมาคำนวณ</span><strong>'+attendanceCount.toLocaleString('th-TH')+'</strong></div></div><p class="small muted">ข้อมูลนี้เป็นตัวชี้วัดเบื้องต้น ไม่ใช่ผลประเมินคุณภาพอย่างเป็นทางการ</p></section></div><section class="card"><h2 class="card-title"><i class="fa-solid fa-arrow-up-right-from-square"></i> เปิดตารางข้อมูลเพื่อวิเคราะห์เพิ่มเติม</h2><div class="quick-actions"><button class="btn btn-outline" onclick="renderDataModule(\'analytics\',\'GRADE_RESULTS\')">ผลการเรียน</button><button class="btn btn-outline" onclick="renderDataModule(\'analytics\',\'SCORES\')">คะแนน</button><button class="btn btn-outline" onclick="renderDataModule(\'analytics\',\'ATTENDANCE_SUMMARIES\')">สรุปเวลาเรียน</button><button class="btn btn-outline" onclick="renderDataModule(\'analytics\',\'REPORT_SNAPSHOTS\')">ภาพรวมรายงาน</button></div></section>';
